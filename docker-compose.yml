# Production-shaped local stack: pgvector database + the RAG API.
#
#   docker compose up --build
#
# The API defaults to Ollama on the Docker host for embeddings and answer
# generation (open-weight models, nothing leaves the machine). Run Ollama
# on the host with the models pulled:
#   ollama pull nomic-embed-text && ollama pull llama3.1
# For a fully offline pipeline demo instead, set RAG_EMBEDDER=dev and
# RAG_LLM=dev in a .env file (deterministic stand-ins, no models needed).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: companyos
      POSTGRES_PASSWORD: companyos
      POSTGRES_DB: companyos
    volumes:
      - ragdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companyos -d companyos"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8100:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAG_DATABASE_URL: postgresql://companyos:companyos@db:5432/companyos
      RAG_EMBEDDER: ${RAG_EMBEDDER:-ollama}
      RAG_LLM: ${RAG_LLM:-ollama}
      RAG_EMBED_DIM: ${RAG_EMBED_DIM:-768}
      RAG_OLLAMA_BASE_URL: http://host.docker.internal:11434
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-}

volumes:
  ragdata:
