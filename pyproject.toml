[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "companyos-rag-service"
version = "0.1.0"
description = "Retrieval-augmented generation service for CompanyOS: ingest business documents, embed them, and answer questions with cited semantic search (FastAPI + pgvector)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "langchain-core>=0.3",
  "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends() in a parameter default is the documented FastAPI idiom.
extend-immutable-calls = ["fastapi.Depends"]
